<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="750" height="420" fill="#FAFAFA" rx="8"/>

  <text x="375" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4 Approaches to Hallucination Detection</text>

  <!-- Input -->
  <rect x="20" y="170" width="130" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="85" y="195" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">Agent Response</text>
  <text x="85" y="210" text-anchor="middle" font-size="9" fill="#555">+ Source Context</text>

  <!-- Approach 1 -->
  <rect x="200" y="40" width="250" height="65" rx="8" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1"/>
  <text x="220" y="60" font-size="11" font-weight="bold" fill="#3F51B5">1. Strands (Rubric)</text>
  <text x="220" y="78" font-size="9" fill="#555">OutputEvaluator + custom rubric</text>
  <text x="220" y="93" font-size="9" fill="#888">→ Single score (0-1) + reason</text>
  <rect x="480" y="55" width="85" height="28" rx="5" fill="#3F51B5"/>
  <text x="522" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Score: 0.3</text>
  <text x="585" y="74" font-size="9" fill="#999" font-style="italic">post-hoc</text>

  <!-- Approach 2 -->
  <rect x="200" y="120" width="250" height="65" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>
  <text x="220" y="140" font-size="11" font-weight="bold" fill="#2E7D32">2. RAGAS (Claims)</text>
  <text x="220" y="158" font-size="9" fill="#555">Faithfulness: auto claim decomposition</text>
  <text x="220" y="173" font-size="9" fill="#888">→ Per-claim verification scores</text>
  <rect x="480" y="133" width="100" height="28" rx="5" fill="#2E7D32"/>
  <text x="530" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="white">2/5 claims OK</text>
  <text x="600" y="152" font-size="9" fill="#999" font-style="italic">post-hoc</text>

  <!-- Approach 3 -->
  <rect x="200" y="200" width="250" height="65" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
  <text x="220" y="220" font-size="11" font-weight="bold" fill="#E65100">3. Claim Decomposition</text>
  <text x="220" y="238" font-size="9" fill="#555">Decompose → Verify each claim</text>
  <text x="220" y="253" font-size="9" fill="#888">→ Identifies exact fabricated claims</text>
  <rect x="480" y="210" width="130" height="38" rx="5" fill="#E65100"/>
  <text x="545" y="228" text-anchor="middle" font-size="9" font-weight="bold" fill="white">❌ champagne</text>
  <text x="545" y="242" text-anchor="middle" font-size="9" font-weight="bold" fill="white">❌ TripAdvisor rating</text>
  <text x="630" y="234" font-size="9" fill="#999" font-style="italic">post-hoc</text>

  <!-- Approach 4 -->
  <rect x="200" y="280" width="250" height="65" rx="8" fill="#FCE4EC" stroke="#C62828" stroke-width="1"/>
  <text x="220" y="300" font-size="11" font-weight="bold" fill="#C62828">4. Real-Time (Hooks)</text>
  <text x="220" y="318" font-size="9" fill="#555">HookProvider intercepts AfterModelCall</text>
  <text x="220" y="333" font-size="9" fill="#888">→ Block before user sees it</text>
  <rect x="480" y="293" width="105" height="28" rx="5" fill="#C62828"/>
  <text x="532" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="white">⚠️ BLOCKED</text>
  <text x="605" y="312" font-size="9" fill="#C62828" font-weight="bold">real-time</text>

  <!-- Arrows -->
  <line x1="150" y1="185" x2="198" y2="75" stroke="#666" stroke-width="1.2"/>
  <line x1="150" y1="195" x2="198" y2="150" stroke="#666" stroke-width="1.2"/>
  <line x1="150" y1="205" x2="198" y2="230" stroke="#666" stroke-width="1.2"/>
  <line x1="150" y1="215" x2="198" y2="310" stroke="#666" stroke-width="1.2"/>
  <line x1="450" y1="70" x2="478" y2="70" stroke="#3F51B5" stroke-width="1.5"/>
  <line x1="450" y1="148" x2="478" y2="148" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="450" y1="230" x2="478" y2="230" stroke="#E65100" stroke-width="1.5"/>
  <line x1="450" y1="308" x2="478" y2="308" stroke="#C62828" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="200" y="365" width="350" height="45" rx="6" fill="#F5F5F5" stroke="#DDD"/>
  <text x="215" y="382" font-size="9" font-weight="bold" fill="#555">Choose based on your need:</text>
  <text x="215" y="398" font-size="9" fill="#666">Quick check → 1 | Granularity → 2 or 3 | Production guardrail → 4</text>
</svg>
