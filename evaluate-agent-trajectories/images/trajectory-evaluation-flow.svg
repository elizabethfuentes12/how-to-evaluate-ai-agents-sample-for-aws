<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="350" fill="#FAFAFA" rx="8"/>

  <text x="400" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Trajectory Evaluation: Capture → Evaluate → Decide</text>

  <!-- Agent -->
  <rect x="20" y="55" width="110" height="45" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="75" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">Agent</text>
  <text x="75" y="90" text-anchor="middle" font-size="8" fill="#555">receives query</text>

  <!-- Tool calls -->
  <rect x="165" y="45" width="100" height="25" rx="5" fill="#C8E6C9" stroke="#2E7D32"/>
  <text x="215" y="63" text-anchor="middle" font-size="9" fill="#333">search_flights</text>
  <rect x="165" y="78" width="100" height="25" rx="5" fill="#C8E6C9" stroke="#2E7D32"/>
  <text x="215" y="96" text-anchor="middle" font-size="9" fill="#333">get_weather</text>

  <!-- Hook -->
  <rect x="300" y="45" width="135" height="60" rx="8" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <text x="367" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#F57F17">TrajectoryPlugin</text>
  <text x="367" y="80" text-anchor="middle" font-size="8" fill="#555">(HookProvider)</text>
  <text x="367" y="93" text-anchor="middle" font-size="8" fill="#888">captures every call</text>

  <!-- Trajectory -->
  <rect x="475" y="45" width="170" height="60" rx="8" fill="#FFE0B2" stroke="#E65100" stroke-width="1.5"/>
  <text x="560" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">Trajectory Data</text>
  <text x="560" y="80" text-anchor="middle" font-size="8" fill="#555">[search_flights, get_weather]</text>
  <text x="560" y="93" text-anchor="middle" font-size="8" fill="#888">+ timing, status, params</text>

  <!-- Arrows top row -->
  <line x1="130" y1="70" x2="163" y2="58" stroke="#666" stroke-width="1.2"/>
  <line x1="130" y1="82" x2="163" y2="90" stroke="#666" stroke-width="1.2"/>
  <line x1="265" y1="58" x2="298" y2="65" stroke="#666" stroke-width="1"/>
  <line x1="265" y1="90" x2="298" y2="82" stroke="#666" stroke-width="1"/>
  <line x1="435" y1="75" x2="473" y2="75" stroke="#E65100" stroke-width="2"/>

  <!-- 3 evaluators -->
  <rect x="80" y="160" width="170" height="55" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="165" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">ToolCalled</text>
  <text x="165" y="198" text-anchor="middle" font-size="9" fill="#555">deterministic · FREE</text>

  <rect x="300" y="160" width="200" height="55" rx="8" fill="#E8EAF6" stroke="#3F51B5"/>
  <text x="400" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#3F51B5">TrajectoryEvaluator</text>
  <text x="400" y="198" text-anchor="middle" font-size="9" fill="#555">LLM judge · semantic quality</text>

  <rect x="550" y="160" width="180" height="55" rx="8" fill="#FCE4EC" stroke="#C62828"/>
  <text x="640" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">Risk Score</text>
  <text x="640" y="198" text-anchor="middle" font-size="9" fill="#555">deterministic · failures + dupes</text>

  <!-- Arrows from trajectory to evaluators -->
  <line x1="520" y1="105" x2="165" y2="158" stroke="#2E7D32" stroke-width="1.2"/>
  <line x1="560" y1="105" x2="400" y2="158" stroke="#3F51B5" stroke-width="1.2"/>
  <line x1="600" y1="105" x2="640" y2="158" stroke="#C62828" stroke-width="1.2"/>

  <!-- Results -->
  <rect x="120" y="240" width="90" height="30" rx="5" fill="#2E7D32"/>
  <text x="165" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="white">✅ / ❌</text>

  <rect x="360" y="240" width="80" height="30" rx="5" fill="#3F51B5"/>
  <text x="400" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="white">0.85</text>

  <rect x="600" y="240" width="80" height="30" rx="5" fill="#C62828"/>
  <text x="640" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="white">🟢 Low</text>

  <line x1="165" y1="215" x2="165" y2="238" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="400" y1="215" x2="400" y2="238" stroke="#3F51B5" stroke-width="1.5"/>
  <line x1="640" y1="215" x2="640" y2="238" stroke="#C62828" stroke-width="1.5"/>

  <!-- Decision -->
  <polygon points="400,295 520,320 400,345 280,320" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="400" y="325" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">Ship it? Investigate? Block?</text>

  <line x1="165" y1="270" x2="330" y2="310" stroke="#666" stroke-width="1"/>
  <line x1="400" y1="270" x2="400" y2="295" stroke="#666" stroke-width="1"/>
  <line x1="640" y1="270" x2="470" y2="310" stroke="#666" stroke-width="1"/>
</svg>
